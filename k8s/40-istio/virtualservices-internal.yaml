    retries:
      attempts: 3
      perTryTimeout: 3s
      retryOn: gateway-error,connect-failure,refused-stream,5xx
    # Para activar abort injection en demo, descomentar:
    # fault:
    #   abort:
    #     percentage:
    #       value: 50
    #     httpStatus: 503
    route:
    - destination:
        host: ms-appointment
---
