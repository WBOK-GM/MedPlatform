# VirtualServices para tráfico EAST-WEST (servicio → servicio dentro del cluster)
# Aplica retries y timeouts independientemente del Ingress

# ===== ms-auth (interno) =====
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: ms-auth-vs
  namespace: medplatform
spec:
  hosts:
  - ms-auth
  http:
  - timeout: 5s
    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: gateway-error,connect-failure,refused-stream,5xx
    route:
    - destination:
        host: ms-auth
---
# ===== ms-doctor (interno) =====
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: ms-doctor-vs
  namespace: medplatform
spec:
  hosts:
  - ms-doctor
  http:
  - timeout: 5s
    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: gateway-error,connect-failure,refused-stream,5xx
    # Para activar fault injection en demo, descomentar:
    # fault:
    #   delay:
    #     percentage:
    #       value: 100
    #     fixedDelay: 5s
    route:
    - destination:
        host: ms-doctor
---
# ===== ms-appointment (interno) =====
