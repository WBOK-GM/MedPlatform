apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-doctor
  namespace: medplatform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-doctor
  template:
    metadata:
      labels:
        app: ms-doctor
        version: v1
    spec:
      containers:
      - name: ms-doctor
        image: medplatform/ms-doctor:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3002
        env:
        - name: MONGODB_URI
          valueFrom:
            configMapKeyRef:
              name: medplatform-config
              key: MONGODB_URI
        - name: MS_AUTH_URL
          valueFrom:
            configMapKeyRef:
              name: medplatform-config
              key: MS_AUTH_URL
        - name: MS_APPOINTMENT_URL
          valueFrom:
            configMapKeyRef:
              name: medplatform-config
              key: MS_APPOINTMENT_URL
        readinessProbe:
          httpGet:
            path: /doctors?page=0&size=1
            port: 3002
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /doctors?page=0&size=1
            port: 3002
          initialDelaySeconds: 40
          periodSeconds: 15
        resources:
          requests:
            cpu: 150m
            memory: 512Mi
          limits:
            cpu: 700m
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ms-doctor
  namespace: medplatform
spec:
  selector:
    app: ms-doctor
  ports:
  - name: http
    port: 3002
    targetPort: 3002
