services:
  # ==========================================
  # DATABASES & INFRASTRUCTURE
  # ==========================================
  postgres-users:
    image: postgres:15-alpine
    container_name: postgres_users
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: users_db
    ports:
      - "5432:5432"
    volumes:
      - pg_users_data:/var/lib/postgresql/data
    networks:
      - medical_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d users_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-appointments:
    image: postgres:15-alpine
    container_name: postgres_appointments
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: appointments_db
    ports:
      - "5433:5432"
    volumes:
      - pg_appointments_data:/var/lib/postgresql/data
    networks:
      - medical_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d appointments_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: mongodb_doctors
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - medical_network

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - medical_network

  # ==========================================
  # MICROSERVICES (sin Eureka ni ms-gateway)
  # Los micros se comunican por nombre de contenedor via Docker network.
  # Para Kubernetes usar k8s/ — este compose es solo para desarrollo local.
  # ==========================================

  ms-auth:
    build: ./ms-auth
    container_name: ms_auth
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=postgres-users
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_NAME=users_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres-users:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - medical_network

  ms-doctor:
    build: ./ms-doctor
    container_name: ms_doctor
    ports:
      - "3002:3002"
    environment:
      - MONGODB_URI=mongodb://root:rootpassword@mongodb:27017/doctors_db?authSource=admin
      - MS_AUTH_URL=http://ms-auth:3001
      - MS_APPOINTMENT_URL=http://ms-appointment:3003
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - medical_network

  ms-appointment:
    build: ./ms-appointment
    container_name: ms_appointment
    ports:
      - "3003:3003"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres-appointments:5432/appointments_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres-appointments:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - medical_network

  ms-notification:
    build: ./ms-notification
    container_name: ms_notification
    ports:
      - "3004:3004"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
    depends_on:
      kafka:
        condition: service_started
    networks:
      - medical_network

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      # Para desarrollo local (compose) los micros están expuestos directamente al host
      - NEXT_PUBLIC_AUTH_URL=http://localhost:3001
      - NEXT_PUBLIC_DOCTOR_URL=http://localhost:3002
      - NEXT_PUBLIC_APPOINTMENT_URL=http://localhost:3003
    depends_on:
      - ms-auth
      - ms-doctor
      - ms-appointment
    networks:
      - medical_network

networks:
  medical_network:
    driver: bridge

volumes:
  pg_users_data:
  pg_appointments_data:
  mongo_data:
